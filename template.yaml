AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Discra API - dual-stack migration (Java + Python backend)

Parameters:
  Version:
    Type: String
    Default: 0.0.1-tracer
    Description: Deployed version string (use Git SHA in CI)
  AdminToken:
    Type: String
    NoEcho: true
    Description: Admin token for /admin routes (dev only)
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_examplepool
    Description: Cognito User Pool ID used by API Gateway JWT authorizer
  CognitoAppClientId:
    Type: String
    Default: exampleclientid
    Description: Cognito App Client ID (JWT audience)
  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:8000,http://127.0.0.1:8000"
    Description: >-
      Allowed CORS origins for the HTTP API and the app CORS middleware. Defaults
      to local dev origins; set to your deployed app HTTPS origin(s) in prod. Do
      not use "*". Drives both API Gateway CorsConfiguration and CORS_ALLOWED_ORIGINS.
  ApiThrottleRateLimit:
    Type: Number
    Default: 100
    Description: >-
      API Gateway stage steady-state request rate limit (requests/sec, aggregate
      per route) — caps DoS / cost-runaway on every route incl. auth + webhooks.
      Tune to pilot load. NOTE: aggregate throttling, not per-IP; per-IP abuse
      limiting needs AWS WAF, which on an HTTP API requires CloudFront in front.
  ApiThrottleBurstLimit:
    Type: Number
    Default: 200
    Description: >-
      API Gateway stage burst limit (max concurrent request spike, aggregate per
      route). Should be >= ApiThrottleRateLimit.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: >-
      CloudWatch Logs retention for the Lambda log groups (6.1 ops). Lambda-created
      groups default to "never expire", which grows cost without bound and holds
      request data indefinitely (a GDPR storage-limitation concern). 30 days suits
      a pilot; raise for prod audit needs.
  OpsAlertEmail:
    Type: String
    Default: ""
    Description: >-
      Optional email address subscribed to the ops alert SNS topic (6.1). When set,
      AWS sends a confirmation email that must be accepted before alarms deliver.
      Leave empty to create the topic without a subscription (alarms still fire and
      are visible in the console).
  OrsApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: OpenRouteService API key for directions and matrix (free tier 2000 req/day)
  LocationRouteCalculatorName:
    Type: String
    Default: ""
    Description: Optional Amazon Location route calculator name for matrix calls
  LocationPlaceIndexName:
    Type: String
    Default: ""
    Description: Optional Amazon Location place index name for address geocoding
  StripeSecretKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Stripe secret key for subscription seat updates
  StripeWebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Stripe webhook signing secret
  StripeDispatcherPriceId:
    Type: String
    Default: ""
    Description: Optional Stripe price id for dispatcher seats
  StripeDriverPriceId:
    Type: String
    Default: ""
    Description: Optional Stripe price id for driver seats
  OrdersWebhookToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Shared secret for external order-ingest webhook
  OrdersWebhookAllowedOrgId:
    Type: String
    Default: ""
    Description: Required org_id allowed for external order-ingest webhook payloads
  OrdersWebhookHmacSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional HMAC secret for signed external order-ingest webhook payloads
  OrdersWebhookMaxSkewSeconds:
    Type: String
    Default: "300"
    Description: Allowed clock skew in seconds for signed external order-ingest webhooks
  CognitoHostedUiDomain:
    Type: String
    Default: ""
    Description: Optional Cognito hosted UI domain for frontend login helpers
  FrontendMapStyleUrl:
    Type: String
    Default: https://demotiles.maplibre.org/style.json
    Description: MapLibre style JSON URL used by Admin/Dispatcher map view
  EnableUiDevAuth:
    Type: String
    Default: "true"
    Description: Enable cookie-based UI dev auth profiles for no-token manual testing
  DevAuthSecret:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /discra/dev-auth-secret
    Description: Signing secret for UI dev-auth session cookies (dev only)
  UiDevAuthOrgId:
    Type: String
    Default: org-pilot-1
    Description: Default org id bound to UI dev-auth profiles
  UiDevAuthTtlSeconds:
    Type: String
    Default: "43200"
    Description: Session TTL (seconds) for UI dev-auth cookies
  UiDevAuthAdminUserId:
    Type: String
    Default: test-admin
    Description: User id for default Admin dev-auth profile
  UiDevAuthAdminEmail:
    Type: String
    Default: ""
    Description: Optional email for default Admin dev-auth profile
  UiDevAuthDispatcherUserId:
    Type: String
    Default: test-dispatcher
    Description: User id for default Dispatcher dev-auth profile
  UiDevAuthDispatcherEmail:
    Type: String
    Default: ""
    Description: Optional email for default Dispatcher dev-auth profile
  UiDevAuthDriverUserId:
    Type: String
    Default: test-driver
    Description: User id for default Driver dev-auth profile
  UiDevAuthDriverEmail:
    Type: String
    Default: ""
    Description: Optional email for default Driver dev-auth profile
  EnableOnboardingFlow:
    Type: String
    Default: "true"
    Description: Enable tenant admin onboarding registration and review APIs/UI
  OnboardingApproverEmailAllowlist:
    Type: String
    Default: ""
    Description: Comma-separated email allowlist for App Dev approvers
  OnboardingLinkSigningSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: HMAC signing secret for onboarding review links
  OnboardingLinkTtlSeconds:
    Type: String
    Default: "172800"
    Description: Signed review link expiry in seconds
  OnboardingCognitoOrgAttributeKey:
    Type: String
    Default: custom:org_id
    Description: Cognito user attribute key that stores approved org id
  OnboardingSesFromEmail:
    Type: String
    Default: ""
    Description: SES verified sender/from email for onboarding notifications
  OnboardingAppReviewUrlBase:
    Type: String
    Default: ""
    Description: Absolute review page URL base used in review emails (for example https://app.example.com/dev/backend/ui/review)
  OnboardingAppRegisterUrlBase:
    Type: String
    Default: ""
    Description: Absolute registration page URL base used in approval/rejection emails
  VapidPublicKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /discra/vapid-public-key
    Description: VAPID public key (URL-safe base64) for Web Push notifications
  # VapidPrivateKey is a SecureString in SSM — fetched at runtime by push_service.py via boto3, not injected as env var
  AnthropicApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Anthropic API key for AI email format detection and parsing
  VapidClaimEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /discra/vapid-claim-email
    Description: Contact email for VAPID claims (mailto:you@example.com)
  GoogleOAuthClientId:
    Type: String
    Default: ""
    Description: Google OAuth client ID for Gmail API access
  GoogleOAuthClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth client secret for Gmail API access

Conditions:
  # SES sending is only used by the onboarding notifier when a from-email is set;
  # otherwise it logs only. Gate the ses:SendEmail grant on that so the role has no
  # SES permission at all when unconfigured (S-4 least privilege).
  HasSesFromEmail: !Not [!Equals [!Ref OnboardingSesFromEmail, ""]]
  # Amazon Location is optional (code falls back to haversine/in-memory when the
  # names are unset). Gate each geo grant on its resource being configured so the
  # role carries no geo permission otherwise (S-6 least privilege).
  HasLocationRouteCalculator: !Not [!Equals [!Ref LocationRouteCalculatorName, ""]]
  HasLocationPlaceIndex: !Not [!Equals [!Ref LocationPlaceIndexName, ""]]
  # 6.1 ops: only create the SNS email subscription when an address is configured.
  HasOpsAlertEmail: !Not [!Equals [!Ref OpsAlertEmail, ""]]

Globals:
  Function:
    MemorySize: 512
    Timeout: 10
    Tracing: Active
    Architectures: [ x86_64 ]
    Environment:
      Variables:
        VERSION: !Ref Version
    Tags:
      App: Discra
      Env: dev
      Owner: Cody

Resources:
  DiscraApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: dev
      # Stage-wide request throttling (S-3): baseline DoS / cost-runaway protection
      # applied to every route, including the auth/onboarding endpoints served via
      # the /backend/{proxy+} routes and the webhook routes. Aggregate (per-route),
      # not per-IP — per-IP abuse limiting is a WAF follow-up (needs CloudFront).
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
          - x-admin-token
          - x-correlation-id
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
              audience:
                - !Ref CognitoAppClientId
      Tags: { App: Discra, Env: dev }

  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-organizations-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-users-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: user_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: user_id_index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-orders-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: assigned_driver_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: orders_by_assigned_driver
          KeySchema:
            - AttributeName: org_id
              KeyType: HASH
            - AttributeName: assigned_driver_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  PodArtifactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-pod-artifacts-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: pod_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: pod_id
          KeyType: RANGE
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  DriverLocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-driver-locations-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: driver_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: driver_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-push-subscriptions-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: driver_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: driver_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  SeatSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-seat-subscriptions-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  SeatInvitationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-seat-invitations-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: invitation_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: invitation_id
          KeyType: RANGE
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  AuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-audit-logs-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  OnboardingRegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-onboarding-registrations-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: registration_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: updated_at_epoch
          AttributeType: N
      KeySchema:
        - AttributeName: registration_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: registrations_by_status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updated_at_epoch
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  EmailConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-email-config-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      # S-9: point-in-time recovery for persistent business data (backup/restore).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  SkippedEmailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-skipped-emails-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: email_message_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: email_message_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  WsConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "discra-ws-connections-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      # S-7: SSE-KMS (AWS-managed key) for key-usage auditability (vs AWS-owned default).
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: org_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: connections_by_org
          KeySchema:
            - AttributeName: org_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  PodArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # S-9: versioning protects POD artifacts (delivery evidence) against
      # accidental overwrite/delete; the lifecycle rule caps noncurrent-version
      # storage cost and cleans up abandoned multipart uploads.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - POST
              - PUT
            AllowedHeaders:
              - "*"
            MaxAge: 300
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev


  # --- 6.1 ops: explicit log groups with retention -------------------------------
  # Lambda auto-creates /aws/lambda/<generated-function-name> with retention
  # "never expire". We instead declare the groups ourselves and point each
  # function at its group via LoggingConfig, so retention is managed in the
  # template. Names keep the /aws/lambda/ prefix so the SAM-generated execution
  # role's basic-execution logs grant still covers them.
  #
  # NOTE: this moves logging to NEW groups. The previously auto-created groups
  # (and those of long-deleted functions) stay behind holding old data with no
  # retention — see docs/runbook-ops.md for the one-time cleanup.
  BackendApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-backend-api"
      RetentionInDays: !Ref LogRetentionDays

  EmailPollerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-email-poller"
      RetentionInDays: !Ref LogRetentionDays

  WsHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ws-handler"
      RetentionInDays: !Ref LogRetentionDays

  BackendApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref BackendApiLogGroup
      Environment:
        Variables:
          VERSION: !Ref Version
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
          COGNITO_AUDIENCE: !Ref CognitoAppClientId
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          CORS_ALLOWED_ORIGINS: !Join [",", !Ref CorsAllowedOrigins]
          JWT_VERIFY_SIGNATURE: "true"
          ORGANIZATIONS_TABLE: !Ref OrganizationsTable
          USERS_TABLE: !Ref UsersTable
          ORDERS_TABLE: !Ref OrdersTable
          POD_BUCKET_NAME: !Ref PodArtifactsBucket
          POD_ARTIFACTS_TABLE: !Ref PodArtifactsTable
          POD_UPLOAD_URL_EXPIRES_SECONDS: "300"
          DRIVER_LOCATIONS_TABLE: !Ref DriverLocationsTable
          DRIVER_LOCATION_TTL_SECONDS: "7200"
          LOCATION_ROUTE_CALCULATOR_NAME: !Ref LocationRouteCalculatorName
          LOCATION_PLACE_INDEX_NAME: !Ref LocationPlaceIndexName
          ORS_API_KEY: !Ref OrsApiKey
          USE_IN_MEMORY_ROUTE_MATRIX: "false"
          ROUTE_OPTIMIZATION_TIMEOUT_SECONDS: "5"
          SEAT_SUBSCRIPTIONS_TABLE: !Ref SeatSubscriptionsTable
          SEAT_INVITATIONS_TABLE: !Ref SeatInvitationsTable
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          STRIPE_DISPATCHER_PRICE_ID: !Ref StripeDispatcherPriceId
          STRIPE_DRIVER_PRICE_ID: !Ref StripeDriverPriceId
          ORDERS_WEBHOOK_TOKEN: !Ref OrdersWebhookToken
          ORDERS_WEBHOOK_ALLOWED_ORG_ID: !Ref OrdersWebhookAllowedOrgId
          ORDERS_WEBHOOK_HMAC_SECRET: !Ref OrdersWebhookHmacSecret
          ORDERS_WEBHOOK_MAX_SKEW_SECONDS: !Ref OrdersWebhookMaxSkewSeconds
          AUDIT_LOGS_TABLE: !Ref AuditLogsTable
          PUSH_SUBSCRIPTIONS_TABLE: !Ref PushSubscriptionsTable
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          VAPID_PRIVATE_KEY_PARAM: /discra/vapid-private-key
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          VAPID_CLAIM_EMAIL: !Ref VapidClaimEmail
          COGNITO_HOSTED_UI_DOMAIN: !Ref CognitoHostedUiDomain
          FRONTEND_COGNITO_CLIENT_ID: !Ref CognitoAppClientId
          FRONTEND_MAP_STYLE_URL: !Ref FrontendMapStyleUrl
          ENABLE_UI_DEV_AUTH: !Ref EnableUiDevAuth
          DEV_AUTH_SECRET: !Ref DevAuthSecret
          UI_DEV_AUTH_ORG_ID: !Ref UiDevAuthOrgId
          UI_DEV_AUTH_TTL_SECONDS: !Ref UiDevAuthTtlSeconds
          UI_DEV_AUTH_ADMIN_USER_ID: !Ref UiDevAuthAdminUserId
          UI_DEV_AUTH_ADMIN_EMAIL: !Ref UiDevAuthAdminEmail
          UI_DEV_AUTH_DISPATCHER_USER_ID: !Ref UiDevAuthDispatcherUserId
          UI_DEV_AUTH_DISPATCHER_EMAIL: !Ref UiDevAuthDispatcherEmail
          UI_DEV_AUTH_DRIVER_USER_ID: !Ref UiDevAuthDriverUserId
          UI_DEV_AUTH_DRIVER_EMAIL: !Ref UiDevAuthDriverEmail
          ENABLE_ONBOARDING_FLOW: !Ref EnableOnboardingFlow
          ONBOARDING_REGISTRATIONS_TABLE: !Ref OnboardingRegistrationsTable
          ONBOARDING_REGISTRATIONS_STATUS_INDEX: registrations_by_status
          ONBOARDING_APPROVER_EMAIL_ALLOWLIST: !Ref OnboardingApproverEmailAllowlist
          ONBOARDING_LINK_SIGNING_SECRET: !Ref OnboardingLinkSigningSecret
          ONBOARDING_LINK_TTL_SECONDS: !Ref OnboardingLinkTtlSeconds
          ONBOARDING_COGNITO_ORG_ATTRIBUTE_KEY: !Ref OnboardingCognitoOrgAttributeKey
          ONBOARDING_SES_FROM_EMAIL: !Ref OnboardingSesFromEmail
          ONBOARDING_APP_REVIEW_URL_BASE: !Ref OnboardingAppReviewUrlBase
          ONBOARDING_APP_REGISTER_URL_BASE: !Ref OnboardingAppRegisterUrlBase
          EMAIL_CONFIG_TABLE: !Ref EmailConfigTable
          SKIPPED_EMAILS_TABLE: !Ref SkippedEmailsTable
          WS_CONNECTIONS_TABLE: !Ref WsConnectionsTable
          GOOGLE_OAUTH_CLIENT_ID: !Ref GoogleOAuthClientId
          GOOGLE_OAUTH_CLIENT_SECRET: !Ref GoogleOAuthClientSecret
          WS_API_ENDPOINT: !Sub "https://${DiscraWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !GetAtt OrganizationsTable.Arn
              - !GetAtt UsersTable.Arn
              - !Sub "${UsersTable.Arn}/index/*"
              - !GetAtt OrdersTable.Arn
              - !Sub "${OrdersTable.Arn}/index/*"
              - !GetAtt PodArtifactsTable.Arn
              - !GetAtt DriverLocationsTable.Arn
              - !GetAtt SeatSubscriptionsTable.Arn
              - !GetAtt SeatInvitationsTable.Arn
              - !GetAtt AuditLogsTable.Arn
              - !GetAtt PushSubscriptionsTable.Arn
              - !GetAtt OnboardingRegistrationsTable.Arn
              - !Sub "${OnboardingRegistrationsTable.Arn}/index/*"
              - !GetAtt EmailConfigTable.Arn
              - !GetAtt SkippedEmailsTable.Arn
              - !GetAtt WsConnectionsTable.Arn
              - !Sub "${WsConnectionsTable.Arn}/index/*"
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:AbortMultipartUpload
              - s3:GetObject
            Resource: !Sub "${PodArtifactsBucket.Arn}/*"
        # S-6: scope Amazon Location to the configured calculator / place index
        # instead of "*"; each grant is omitted entirely when unconfigured.
        - !If
          - HasLocationRouteCalculator
          - Statement:
              Effect: Allow
              Action:
                - geo:CalculateRouteMatrix
              Resource: !Sub "arn:aws:geo:${AWS::Region}:${AWS::AccountId}:route-calculator/${LocationRouteCalculatorName}"
          - !Ref AWS::NoValue
        - !If
          - HasLocationPlaceIndex
          - Statement:
              Effect: Allow
              Action:
                - geo:SearchPlaceIndexForText
              Resource: !Sub "arn:aws:geo:${AWS::Region}:${AWS::AccountId}:place-index/${LocationPlaceIndexName}"
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action:
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:AdminUpdateUserAttributes
            Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
        # S-4: scope SES to the configured onboarding sender's identity (and its
        # domain identity, covering both SES verification styles) instead of "*".
        # Omitted entirely when no from-email is configured.
        - !If
          - HasSesFromEmail
          - Statement:
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${OnboardingSesFromEmail}"
                - !Sub
                  - "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${Domain}"
                  - Domain: !Select [1, !Split ["@", !Ref OnboardingSesFromEmail]]
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DiscraWebSocketApi}/*"
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/discra/vapid-private-key"
        - Statement:
            Effect: Allow
            Action:
              - kms:Decrypt
            Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
      Events:
        BackendHealthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/health
            Method: GET
        BackendVersionGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/version
            Method: GET
        BackendUiHomeGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui
            Method: GET
        BackendUiAdminGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui/admin
            Method: GET
        BackendUiAdminServiceWorkerGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui/admin-sw.js
            Method: GET
        BackendUiDriverGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui/driver
            Method: GET
        BackendUiRegisterGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui/register
            Method: GET
        BackendUiReviewGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui/review
            Method: GET
        BackendUiDriverServiceWorkerGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui/driver-sw.js
            Method: GET
        BackendUiConfigGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui/config
            Method: GET
        BackendUiAssetsProxyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/ui/assets/{proxy+}
            Method: GET
        BackendStripeWebhookPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/webhooks/stripe
            Method: POST
        BackendOrdersWebhookPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/webhooks/orders
            Method: POST
        BackendProtectedProxyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/{proxy+}
            Method: GET
        BackendProtectedProxyPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/{proxy+}
            Method: POST
        BackendProtectedProxyPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/{proxy+}
            Method: PUT
        BackendProtectedProxyPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/{proxy+}
            Method: PATCH
        BackendProtectedProxyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscraApi
            Path: /backend/{proxy+}
            Method: DELETE
      Tags: { App: Discra, Env: dev }
    Metadata:
      DockerTag: python3.12-v1
      DockerContext: ./backend
      Dockerfile: Dockerfile

  EmailPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: email_poller_fn
      Handler: email_poller.handler
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref EmailPollerLogGroup
      Environment:
        Variables:
          EMAIL_CONFIG_TABLE: !Ref EmailConfigTable
          SKIPPED_EMAILS_TABLE: !Ref SkippedEmailsTable
          ORDERS_TABLE: !Ref OrdersTable
          GOOGLE_OAUTH_CLIENT_ID: !Ref GoogleOAuthClientId
          GOOGLE_OAUTH_CLIENT_SECRET: !Ref GoogleOAuthClientSecret
          WS_CONNECTIONS_TABLE: !Ref WsConnectionsTable
          WS_API_ENDPOINT: !Sub "https://${DiscraWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !GetAtt EmailConfigTable.Arn
              - !GetAtt SkippedEmailsTable.Arn
              - !GetAtt OrdersTable.Arn
              - !Sub "${OrdersTable.Arn}/index/*"
              - !GetAtt WsConnectionsTable.Arn
              - !Sub "${WsConnectionsTable.Arn}/index/*"
        - Statement:
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DiscraWebSocketApi}/*"
      Events:
        ScheduledPoll:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
      Tags: { App: Discra, Env: dev }

  # ── WebSocket API for real-time notifications ──
  DiscraWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "discra-ws-${AWS::StackName}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"
      Tags:
        App: Discra
        Env: dev

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DiscraWebSocketApi
      RouteKey: "$connect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WsConnectIntegration}"

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DiscraWebSocketApi
      RouteKey: "$disconnect"
      Target: !Sub "integrations/${WsDisconnectIntegration}"

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DiscraWebSocketApi
      RouteKey: "$default"
      Target: !Sub "integrations/${WsDefaultIntegration}"

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DiscraWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsHandlerFunction.Arn}/invocations"

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DiscraWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsHandlerFunction.Arn}/invocations"

  WsDefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DiscraWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsHandlerFunction.Arn}/invocations"

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DiscraWebSocketApi
      StageName: dev
      AutoDeploy: true
      Tags:
        App: Discra
        Env: dev

  WsDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WsConnectRoute
      - WsDisconnectRoute
      - WsDefaultRoute
    Properties:
      ApiId: !Ref DiscraWebSocketApi

  WsHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: ws_handler_fn
      Handler: ws_handler.handler
      MemorySize: 256
      Timeout: 10
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref WsHandlerLogGroup
      Environment:
        Variables:
          WS_CONNECTIONS_TABLE: !Ref WsConnectionsTable
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
          COGNITO_AUDIENCE: !Ref CognitoAppClientId
          JWT_VERIFY_SIGNATURE: "true"
          ENABLE_UI_DEV_AUTH: !Ref EnableUiDevAuth
          DEV_AUTH_SECRET: !Ref DevAuthSecret
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
              - dynamodb:Query
            Resource:
              - !GetAtt WsConnectionsTable.Arn
              - !Sub "${WsConnectionsTable.Arn}/index/*"
      Tags: { App: Discra, Env: dev }

  WsHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WsHandlerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DiscraWebSocketApi}/*"

  # --- 6.1 ops: alerting ---------------------------------------------------------
  # Single topic for every alarm. Alarms fire into it whether or not a subscriber
  # exists, so the alarm state is always visible in the console/dashboard; the
  # email subscription just adds push delivery.
  OpsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-ops-alerts"
      DisplayName: Discra ops alerts
      Tags:
        - Key: App
          Value: Discra
        - Key: Env
          Value: dev

  OpsAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasOpsAlertEmail
    Properties:
      TopicArn: !Ref OpsAlertTopic
      Protocol: email
      Endpoint: !Ref OpsAlertEmail

  # --- 6.1 ops: alarms -----------------------------------------------------------
  # TreatMissingData: notBreaching throughout — a quiet pilot stack produces no
  # datapoints, and "no traffic" must not read as "broken".
  BackendApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-backend-api-errors"
      AlarmDescription: >-
        Backend API Lambda is returning unhandled errors. Check the function log
        group for tracebacks; this is the primary "the app is broken" signal.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  BackendApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-backend-api-throttles"
      AlarmDescription: >-
        Backend API Lambda is being throttled (concurrency limit reached).
        Requests are failing outright — raise reserved concurrency or the account
        limit.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  BackendApiDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-backend-api-duration-p95"
      AlarmDescription: >-
        Backend API p95 duration is within striking distance of the 30s function
        timeout. Requests are about to start timing out.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendApiFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: >-
        HTTP API is serving 5xx responses. Catches gateway/integration failures
        that never reach the Lambda error metric.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref DiscraApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-latency-p95"
      AlarmDescription: >-
        HTTP API p95 end-to-end latency is above 5s — the console and driver PWA
        will feel broken well before anything errors.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref DiscraApi
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  EmailPollerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-email-poller-errors"
      AlarmDescription: >-
        Scheduled email poller is failing. Order intake from email silently stops
        when this breaks, so even one error is worth surfacing (longer window than
        the API alarms since it runs on a schedule).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmailPollerFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  WsHandlerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ws-handler-errors"
      AlarmDescription: >-
        WebSocket handler is failing — real-time order/notification pushes are
        degraded (the app still works via polling, hence the higher threshold).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WsHandlerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  OrdersTableThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-orders-table-throttles"
      AlarmDescription: >-
        The orders table is throttling requests. On-demand tables can still
        throttle when traffic outruns the auto-scaled partition capacity.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref OrdersTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  # --- 6.1 ops: dashboard --------------------------------------------------------
  # One dashboard (first 3 are free). Traffic/health up top, then per-function
  # detail, then the data layer.
  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-ops"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "HTTP API — requests and errors",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300, "view": "timeSeries", "stacked": false,
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiId", "${DiscraApi}", { "label": "requests" } ],
                  [ ".", "4xx", ".", ".", { "label": "4xx" } ],
                  [ ".", "5xx", ".", ".", { "label": "5xx" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "HTTP API — latency",
                "region": "${AWS::Region}",
                "period": 300, "view": "timeSeries", "stacked": false,
                "metrics": [
                  [ "AWS/ApiGateway", "Latency", "ApiId", "${DiscraApi}", { "stat": "p50", "label": "p50" } ],
                  [ "...", { "stat": "p95", "label": "p95" } ],
                  [ "...", { "stat": "p99", "label": "p99" } ],
                  [ "AWS/ApiGateway", "IntegrationLatency", "ApiId", "${DiscraApi}", { "stat": "p95", "label": "integration p95" } ]
                ],
                "yAxis": { "left": { "label": "ms", "showUnits": false } }
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Backend API Lambda",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300, "view": "timeSeries", "stacked": false,
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${BackendApiFunction}", { "label": "invocations" } ],
                  [ ".", "Errors", ".", ".", { "label": "errors" } ],
                  [ ".", "Throttles", ".", ".", { "label": "throttles" } ],
                  [ ".", "ConcurrentExecutions", ".", ".", { "stat": "Maximum", "label": "peak concurrency" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Backend API duration (timeout 30s)",
                "region": "${AWS::Region}",
                "period": 300, "view": "timeSeries", "stacked": false,
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${BackendApiFunction}", { "stat": "Average", "label": "avg" } ],
                  [ "...", { "stat": "p95", "label": "p95" } ],
                  [ "...", { "stat": "Maximum", "label": "max" } ]
                ],
                "yAxis": { "left": { "label": "ms", "showUnits": false } },
                "annotations": {
                  "horizontal": [
                    { "label": "p95 alarm", "value": 20000 },
                    { "label": "timeout", "value": 30000, "fill": "above" }
                  ]
                }
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Background functions — errors",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 900, "view": "timeSeries", "stacked": false,
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${EmailPollerFunction}", { "label": "email poller invocations" } ],
                  [ ".", "Errors", ".", ".", { "label": "email poller errors" } ],
                  [ ".", "Errors", ".", "${WsHandlerFunction}", { "label": "ws handler errors" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB — orders table",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300, "view": "timeSeries", "stacked": false,
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${OrdersTable}", { "label": "read units" } ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", ".", { "label": "write units" } ],
                  [ ".", "ThrottledRequests", ".", ".", { "label": "throttled" } ],
                  [ ".", "SystemErrors", ".", ".", { "label": "system errors" } ]
                ]
              }
            }
          ]
        }

Outputs:
  ApiId:
    Description: HTTP API ID
    Value: !Ref DiscraApi

  ApiEndpoint:
    Description: Base URL for the HTTP API (no stage suffix)
    Value: !GetAtt DiscraApi.ApiEndpoint

  HealthUrl:
    Description: Full URL for GET /health
    Value: !Sub
      - "${Endpoint}/dev/health"
      - { Endpoint: !GetAtt DiscraApi.ApiEndpoint }

